<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data-Driven Governance & Public Policy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#02000a;font-family:'Rajdhani',sans-serif;cursor:none;}

/*
  IRONBOW PALETTE — thermographic imaging standard
  cold → hot: #000000 → #1a0033 → #3d007a → #7b00d4 → #c800c8 → #ff0066 → #ff5500 → #ffaa00 → #ffff00 → #ffffff
  Nodes are mapped across this spectrum by thermal significance.
  Anomalies (hottest = white/yellow) stand out against cold violet/indigo background.
*/

/* ── CURSOR ── */
#cursor{position:fixed;top:0;left:0;width:24px;height:24px;border:2px solid #c800c8;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .15s,height .15s,border-color .15s;box-shadow:0 0 18px #c800c8,0 0 36px rgba(200,0,200,.4);}
#cursor.hover{width:44px;height:44px;border-color:#ffff44;box-shadow:0 0 30px #ffff44,0 0 60px rgba(255,255,68,.5),0 0 100px rgba(255,200,0,.3);}
#cursor-dot{position:fixed;top:0;left:0;width:5px;height:5px;background:#ff0066;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);box-shadow:0 0 10px #ff0066,0 0 20px rgba(255,0,102,.5);}

/* ── CANVAS ── */
#bg-canvas{position:fixed;inset:0;z-index:0;}

/* ── VIGNETTE ── */
body::after{content:'';position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 85% 75% at 50% 52%, transparent 28%, rgba(2,0,10,.82) 100%);}

/* ── POSTER (3-D tilt wrapper) ── */
#poster{position:fixed;inset:0;z-index:3;transform-style:preserve-3d;transition:transform .06s ease-out;}
#poster::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(60,0,80,.05) 2px,rgba(60,0,80,.05) 3px);pointer-events:none;z-index:500;}

/* IRONBOW ambient glow overlay — mimics IR camera sensor bloom */
#ib-ambient{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 50% 54%, rgba(120,0,180,.09) 0%, transparent 70%),
    radial-gradient(ellipse 100% 100% at 50% 50%, rgba(30,0,60,.18) 0%, transparent 80%);
  animation:ibpulse 5s ease-in-out infinite;}
@keyframes ibpulse{0%,100%{opacity:.8}50%{opacity:1;}}

/* IRONBOW legend bar */
#ib-legend{
  position:fixed;bottom:46px;right:22px;z-index:400;pointer-events:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
}
#ib-legend-bar{
  width:12px;height:160px;border-radius:6px;
  background:linear-gradient(to bottom,
    #ffffff 0%, #ffff44 8%, #ffaa00 18%, #ff5500 28%,
    #ff0066 40%, #c800c8 54%, #7b00d4 66%, #3d007a 78%, #1a0033 90%, #000000 100%);
  box-shadow:0 0 12px rgba(200,0,200,.4),0 0 24px rgba(120,0,180,.2);
  border:1px solid rgba(200,0,200,.25);
}
.ib-lbl{font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(200,150,255,.6);letter-spacing:1px;}
.ib-lbl-hot{color:rgba(255,255,180,.8);text-shadow:0 0 8px #ffdd00;}
.ib-lbl-cold{color:rgba(100,60,160,.7);}
.ib-lbl-title{font-family:'Share Tech Mono',monospace;font-size:7.5px;color:rgba(180,100,255,.55);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;text-align:right;}

/* ── HEADER ── */
#header{position:absolute;top:0;left:0;right:0;text-align:center;padding:22px 60px 0;z-index:20;pointer-events:none;}
.top-label{font-family:'Share Tech Mono',monospace;font-size:11px;color:#c800c8;letter-spacing:6px;margin-bottom:12px;animation:blink 4s ease-in-out infinite;text-align:left;text-shadow:0 0 14px #c800c8,0 0 28px rgba(200,0,200,.5);}
.live-system{font-size:20px;color:#ff0066;text-shadow:0 0 16px #ff0066,0 0 40px rgba(255,0,102,.8),0 0 80px rgba(200,0,100,.5);font-weight:700;letter-spacing:4px;}
@keyframes blink{0%,80%,100%{opacity:1}88%{opacity:.15}}
.main-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(26px,4vw,62px);
  font-weight:900;color:#ffffff;line-height:1.1;letter-spacing:5px;
  text-shadow:
    0 0 20px #fff,
    0 0 50px rgba(255,255,100,.9),
    0 0 100px rgba(255,100,200,.7),
    0 0 180px rgba(150,0,200,.5),
    3px 3px 0 rgba(200,0,200,.25),6px 6px 0 rgba(100,0,150,.15);
}
.main-title .ac{color:#ffaa00;position:relative;display:inline-block;
  text-shadow:0 0 20px #ffaa00,0 0 60px rgba(255,170,0,.9),0 0 120px rgba(255,80,0,.6);}
.main-title .ac::after{content:'';position:absolute;bottom:-5px;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#c800c8,#ff0066,#ffaa00,#ffff44,#ffaa00,#c800c8,transparent);
  animation:uline 2.5s ease-in-out infinite;box-shadow:0 0 12px #ff0066;}
@keyframes uline{0%,100%{opacity:.5;transform:scaleX(.4)}50%{opacity:1;transform:scaleX(1)}}

/* ── NODE CARDS ── */
.node-card{position:absolute;z-index:30;cursor:pointer;transform:translate(-50%,-50%);}

/* anomaly pulse — rings out from node like IR bloom */
.node-card.anomaly::before{
  content:'';position:absolute;top:50%;left:50%;width:100%;height:100%;
  border-radius:4px;transform:translate(-50%,-50%);
  animation:anomaly-ring 2.2s ease-out infinite;
  pointer-events:none;z-index:-1;
  box-shadow:0 0 0 0 var(--nc,#ffff44);
}
@keyframes anomaly-ring{
  0%{box-shadow:0 0 0 0 var(--nc,#ffff44);opacity:.8;}
  70%{box-shadow:0 0 0 22px transparent;opacity:0;}
  100%{box-shadow:0 0 0 0 transparent;opacity:0;}
}

.node-inner{
  background:linear-gradient(145deg,rgba(4,0,12,.99) 0%,rgba(10,0,24,1) 100%);
  border:2px solid var(--nc,rgba(200,0,200,.8));
  padding:12px 16px 10px;position:relative;overflow:hidden;
  transition:all .3s cubic-bezier(.2,.8,.3,1);
  min-width:120px;max-width:150px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,1),
    0 0 25px rgba(0,0,0,1),
    0 0 22px var(--nc,rgba(200,0,200,.22)),
    inset 0 0 20px rgba(10,0,30,.5);
}
/* corner brackets */
.node-inner::before{content:'';position:absolute;top:0;left:0;width:13px;height:13px;border-color:var(--nc,#c800c8);border-style:solid;border-width:3px 0 0 3px;z-index:2;}
.node-inner::after{content:'';position:absolute;bottom:0;right:0;width:13px;height:13px;border-color:var(--nc,#c800c8);border-style:solid;border-width:0 3px 3px 0;z-index:2;}
/* top glow line */
.node-inner .tline{position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--nc,#c800c8),#fff,var(--nc,#c800c8),transparent);opacity:0;transition:opacity .28s;box-shadow:0 0 8px var(--nc,#c800c8);}
.node-card:hover .node-inner .tline{opacity:1;}
/* inner sweep */
.node-inner .sweep{position:absolute;inset:0;background:linear-gradient(140deg,transparent 30%,rgba(255,255,255,.04) 100%);opacity:0;transition:opacity .28s;}
.node-card:hover .node-inner .sweep{opacity:1;}

/* heat band at bottom of card — shows temperature strip like an IR readout */
.node-inner .heat-band{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--nc,#c800c8),#fff,var(--nc,#c800c8),transparent);
  opacity:.6;
  box-shadow:0 0 10px var(--nc,#c800c8);
}

.node-card:hover .node-inner{
  border-color:var(--nc,#c800c8);
  box-shadow:0 0 0 1px rgba(0,0,0,1),0 0 40px rgba(0,0,0,.9),0 0 65px var(--nc,rgba(200,0,200,.55)),inset 0 0 30px rgba(20,0,50,.6);
  transform:scale(1.12) translateZ(40px);
}
.node-icon{font-size:22px;display:block;margin-bottom:4px;filter:drop-shadow(0 0 10px var(--nc,#c800c8));transition:transform .3s;}
.node-card:hover .node-icon{transform:scale(1.2) translateZ(5px);}
.node-title{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;color:var(--nc,#c800c8);text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 12px var(--nc,#c800c8),0 0 24px var(--nc,#c800c8);}
.node-value{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:#ffffff;text-shadow:0 0 12px #fff,0 0 24px var(--nc,#c800c8),0 0 48px var(--nc,#c800c8);line-height:1;margin:3px 0 0;}

/* ── NODE TAG — floats beside node, anchored via JS ── */
.node-tag{
  position:absolute;z-index:25;pointer-events:none;
  font-family:'Share Tech Mono',monospace;font-size:8px;
  color:rgba(210,170,255,.7);letter-spacing:.8px;
  white-space:nowrap;
  display:flex;align-items:center;gap:5px;
  transform:translate(0,0);
}
.node-tag-dot{
  width:5px;height:5px;border-radius:50%;flex-shrink:0;
  animation:dpulse 2s ease-in-out infinite;
}
.node-tag-line{
  height:1px;width:28px;flex-shrink:0;
  opacity:.4;
}
.node-tag-text{
  font-family:'Share Tech Mono',monospace;font-size:7.5px;
  color:rgba(200,160,255,.65);letter-spacing:.9px;
  line-height:1.4;max-width:110px;
}
.node-ring{position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;border:1px dashed transparent;transform:translate(-50%,-50%);pointer-events:none;animation:spinr 5s linear infinite;transition:width .35s,height .35s,border-color .35s,opacity .35s;opacity:0;}
@keyframes spinr{to{transform:translate(-50%,-50%) rotate(360deg)}}
.node-card:hover .node-ring{width:165px;height:165px;border-color:var(--nc,#c800c8);opacity:.22;}

/* ── FLOATING POPUP ── */
#floating-popup{
  position:fixed;z-index:9000;
  width:340px;
  background:linear-gradient(160deg,rgba(4,0,14,.99) 0%,rgba(8,0,22,1) 100%);
  border:2px solid var(--pc,#c800c8);
  padding:20px 22px 18px;
  pointer-events:none;
  opacity:0;
  transform:scale(.9) translateY(8px);
  transition:opacity .2s ease, transform .2s cubic-bezier(.2,.8,.3,1);
  box-shadow:
    0 0 0 1px rgba(0,0,0,1),
    0 8px 60px rgba(0,0,0,1),
    0 0 60px rgba(0,0,0,.9),
    0 0 55px var(--pc,rgba(200,0,200,.28)),
    inset 0 1px 0 rgba(200,100,255,.06);
}
#floating-popup.visible{opacity:1;transform:scale(1) translateY(0);}
#floating-popup::before{
  content:'';position:absolute;inset:-1px;
  background:linear-gradient(135deg,var(--pc,#c800c8),transparent 45%,transparent 55%,var(--pc,#c800c8));
  opacity:.1;z-index:-1;border-radius:inherit;
}
#floating-popup .fp-tl,#floating-popup .fp-tr,#floating-popup .fp-bl,#floating-popup .fp-br{position:absolute;width:12px;height:12px;border-color:var(--pc,#c800c8);border-style:solid;}
#floating-popup .fp-tl{top:-1px;left:-1px;border-width:2px 0 0 2px;}
#floating-popup .fp-tr{top:-1px;right:-1px;border-width:2px 2px 0 0;}
#floating-popup .fp-bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}
#floating-popup .fp-br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

.fp-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.fp-icon{font-size:30px;filter:drop-shadow(0 0 12px var(--pc,#c800c8));flex-shrink:0;}
.fp-title-wrap{}
.fp-title{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--pc,#c800c8);letter-spacing:2.5px;text-shadow:0 0 16px var(--pc,#c800c8),0 0 32px var(--pc,#c800c8);text-transform:uppercase;}
.fp-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(180,130,255,.55);letter-spacing:.8px;margin-top:3px;}
.fp-divider{height:2px;background:linear-gradient(90deg,var(--pc,#c800c8),rgba(255,150,255,.1),transparent);margin-bottom:12px;opacity:.7;box-shadow:0 0 8px var(--pc,#c800c8);}
.fp-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;margin-bottom:13px;}
.fp-stat{background:rgba(150,0,200,.05);border:1px solid rgba(180,0,220,.14);padding:7px 9px;position:relative;}
.fp-stat::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--pc,#c800c8);opacity:.8;box-shadow:0 0 8px var(--pc,#c800c8);}
.fp-stat-label{font-family:'Share Tech Mono',monospace;font-size:7.5px;color:rgba(180,130,255,.45);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.fp-stat-val{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--pc,#c800c8);text-shadow:0 0 10px var(--pc,#c800c8);}

/* IRONBOW gradient bar inside popup — maps the node's position on the full scale */
.fp-ironbow-strip{
  height:4px;border-radius:2px;margin-bottom:11px;
  background:linear-gradient(90deg,
    #000000 0%, #1a0033 12%, #3d007a 24%, #7b00d4 36%,
    #c800c8 50%, #ff0066 62%, #ff5500 74%, #ffaa00 86%, #ffff44 100%);
  position:relative;
  box-shadow:0 0 10px rgba(200,0,200,.3);
}
.fp-ironbow-marker{
  position:absolute;top:-3px;width:2px;height:10px;
  background:#ffffff;border-radius:1px;
  box-shadow:0 0 8px #fff,0 0 16px rgba(255,255,255,.8);
  transform:translateX(-50%);
  transition:left .5s cubic-bezier(.4,0,.2,1);
}
.fp-ironbow-lbl{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:7px;color:rgba(180,130,255,.4);margin-bottom:3px;letter-spacing:.5px;}

.fp-bar-row{margin-bottom:8px;}
.fp-bar-lbl{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(180,130,255,.5);margin-bottom:5px;letter-spacing:.5px;}
.fp-bar-lbl span:last-child{color:var(--pc,#c800c8);text-shadow:0 0 8px var(--pc,#c800c8);}
.fp-bar-track{height:5px;background:rgba(150,0,200,.1);border-radius:3px;overflow:hidden;position:relative;}
.fp-bar-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#3d007a,#c800c8,#ff0066,var(--pc,#ffaa00));
  box-shadow:0 0 14px var(--pc,#c800c8),0 0 28px var(--pc,rgba(200,0,200,.4));
  transition:width .7s cubic-bezier(.4,0,.2,1);width:0%;
}

/* ── INDIA SCENARIO & PREDICTION BLOCKS ── */
.fp-india-section{margin-bottom:11px;}
.fp-section-hdr{
  font-family:'Share Tech Mono',monospace;font-size:7.5px;letter-spacing:2.5px;text-transform:uppercase;
  margin-bottom:6px;display:flex;align-items:center;gap:6px;
}
.fp-section-hdr::before{content:'';flex:none;width:16px;height:1px;background:var(--pc,#c800c8);box-shadow:0 0 6px var(--pc,#c800c8);}
.fp-section-hdr.india-hdr{color:rgba(255,180,100,.75);}
.fp-section-hdr.pred-hdr{color:rgba(150,220,255,.65);}
.fp-scenario-text{
  font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:500;
  color:rgba(255,210,160,.88);line-height:1.55;
  border-left:2px solid var(--pc,#c800c8);padding-left:9px;
  opacity:.9;
}
.fp-pred-text{
  font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:500;
  color:rgba(180,220,255,.85);line-height:1.55;
  border-left:2px solid rgba(100,180,255,.5);padding-left:9px;
}
.fp-pred-text em{
  font-style:normal;
  color:rgba(150,255,200,.9);
  font-weight:700;
}

/* ── CENTER NODE ── */
#center-node{position:absolute;z-index:35;transform:translate(-50%,-50%);}
.center-wrap{position:relative;width:140px;height:140px;animation:cfloat 5.5s ease-in-out infinite;}
@keyframes cfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.center-glyph{
  width:140px;height:140px;
  background:radial-gradient(circle,rgba(50,0,80,.98) 0%,rgba(4,0,14,1) 68%);
  border:3px solid rgba(255,200,80,.95);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:50px;
  box-shadow:0 0 0 1px rgba(0,0,0,1),0 0 70px rgba(255,200,50,.9),0 0 140px rgba(255,100,0,.6),0 0 240px rgba(200,0,200,.4),inset 0 0 50px rgba(100,0,150,.6);
  animation:cglow 3.5s ease-in-out infinite;position:relative;z-index:2;
}
@keyframes cglow{
  0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,1),0 0 70px rgba(255,200,50,.9),0 0 140px rgba(255,80,0,.6),0 0 220px rgba(200,0,200,.4),inset 0 0 50px rgba(100,0,150,.6)}
  50%{box-shadow:0 0 0 1px rgba(0,0,0,1),0 0 120px rgba(255,255,100,1),0 0 240px rgba(255,120,0,.9),0 0 400px rgba(200,0,255,.5),0 0 500px rgba(100,0,200,.3),inset 0 0 80px rgba(180,0,255,.8)}
}
.center-orbit{position:absolute;top:50%;left:50%;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,100,0,.3);transform:translate(-50%,-50%);animation:ospin 12s linear infinite;box-shadow:0 0 15px rgba(255,80,0,.15);}
@keyframes ospin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.center-orbit::after{content:'';position:absolute;top:0;left:50%;width:7px;height:7px;background:#ffaa00;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 18px #ffaa00,0 0 36px rgba(255,170,0,.8),0 0 60px rgba(255,100,0,.5);}
.center-orbit2{position:absolute;top:50%;left:50%;width:215px;height:215px;border-radius:50%;border:1px solid rgba(200,0,200,.15);transform:translate(-50%,-50%);animation:ospin 22s linear infinite reverse;}
.center-lbl{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:9px;color:#ffaa00;white-space:nowrap;letter-spacing:3.5px;text-shadow:0 0 16px #ffaa00,0 0 32px rgba(255,170,0,.7);font-weight:700;}

@keyframes dpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(2.2);opacity:.5}}

/* ── CORNERS ── */
.cdec{position:fixed;width:60px;height:60px;z-index:500;pointer-events:none;}
.cdec::before,.cdec::after{content:'';position:absolute;background:#7b00d4;box-shadow:0 0 12px #7b00d4,0 0 24px rgba(123,0,212,.4);}
.cdec::before{width:3px;height:28px;}
.cdec::after{width:28px;height:3px;}
.c-tl{top:10px;left:10px;} .c-tr{top:10px;right:10px;transform:scaleX(-1);}
.c-bl{bottom:10px;left:10px;transform:scaleY(-1);} .c-br{bottom:10px;right:10px;transform:scale(-1);}

/* ── SIDE STATUS ── */
.side-status{position:fixed;z-index:20;pointer-events:none;}
.side-status.left{left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;}
.side-status.right{right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;align-items:flex-end;}
.ss-item{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(180,120,255,.72);letter-spacing:1.6px;display:flex;align-items:center;gap:6px;text-shadow:0 0 8px rgba(150,60,220,.35);}
.ss-dot{width:5px;height:5px;border-radius:50%;background:#c800c8;box-shadow:0 0 10px #c800c8,0 0 20px rgba(200,0,200,.5);animation:dpulse 1.8s ease-in-out infinite;}
</style>
</head>
<body>
<div id="cursor"></div>
<div id="cursor-dot"></div>
<div id="ib-ambient"></div>
<canvas id="bg-canvas"></canvas>

<!-- IRONBOW legend bar -->
<div id="ib-legend">
  <div class="ib-lbl-title">IR PRIORITY</div>
  <div class="ib-lbl ib-lbl-hot">▲ HOT</div>
  <div id="ib-legend-bar"></div>
  <div class="ib-lbl ib-lbl-cold">▼ COLD</div>
</div>

<!-- Corners -->
<div class="cdec c-tl"></div><div class="cdec c-tr"></div>
<div class="cdec c-bl"></div><div class="cdec c-br"></div>

<!-- Side status -->
<div class="side-status left">
  <div class="ss-item"><div class="ss-dot"></div>SYS ONLINE</div>
  <div class="ss-item"><div class="ss-dot" style="animation-delay:.4s;background:#ffaa00;box-shadow:0 0 6px #ffaa00"></div>AI CORE ACTIVE</div>
  <div class="ss-item"><div class="ss-dot" style="animation-delay:.8s;background:#ff0066;box-shadow:0 0 6px #ff0066"></div>FEED LIVE</div>
  <div class="ss-item"><div class="ss-dot" style="animation-delay:1.2s;background:#7b00d4;box-shadow:0 0 6px #7b00d4"></div>ENCRYPTED</div>
  <div class="ss-item"><div class="ss-dot" style="animation-delay:1.6s"></div>NODES: 8</div>
</div>
<div class="side-status right">

const W = () => window.innerWidth;
const H = () => window.innerHeight;
// Center shifted down so top node clears the header
function getCX(){ return W() / 2; }
function getCY(){ return H() * 0.56; }

function nodePos(angle){
  const rad = (angle - 90) * Math.PI / 180;
  const base = Math.min(W(), H());
  const rx = base * 0.41;
  const ry = base * 0.35;
  return { x: getCX() + rx * Math.cos(rad), y: getCY() + ry * Math.sin(rad) };
}

      <div class="fp-bar-track"><div class="fp-bar-fill" style="width:0%" data-target="${b[1]}%"></div></div>
    </div>`).join('');

  // Position: try right of card, else left, clamp to screen
  const rect = cardEl.getBoundingClientRect();
  const margin = 14;

  let x, y;

  // Horizontal: prefer outward direction from center
  const nodeX = rect.left + rect.width / 2;
  if (nodeX < W() / 2) {
    // node on left half → popup to the right
    x = rect.right + margin;
  } else {
    // node on right half → popup to the left
    x = rect.left - PW - margin;

  // Vertical: centre popup on card, clamp to screen
  y = rect.top + rect.height / 2 - PH / 2;

  fpEl.style.top  = y + 'px';

// Tag offset — push tag outward from center so it never overlaps the card
// We compute a vector from center → node, then offset the tag further outward
function tagOffset(angle) {
  // angle is in degrees, 0=top, goes clockwise
  // We want the tag to sit on the outer side of the card
  const rad = (angle - 90) * Math.PI / 180;
  // Outward unit vector
  const ux = Math.cos(rad);
  const uy = Math.sin(rad);

  // Tag offset distance beyond card edge (card ~150px wide)
  const dist = 100;

  // For tag placement: push outward, then choose left/right alignment
  // Left side of screen → tag goes further left, right side → further right
  // Top/bottom → tag goes above/below
  let tx = ux * dist;
  let ty = uy * dist;

  // Alignment hint: if tag is to the left, anchor right edge to this point
  // if tag is to the right, anchor left edge
  const alignRight = ux < -0.3; // tag on left side → text aligns right
  const alignLeft  = ux > 0.3;  // tag on right side → text aligns left

  return { tx, ty, alignRight, alignLeft, ux, uy };
}

  const { tx, ty, alignRight, alignLeft, ux, uy } = tagOffset(n.angle);

  const tag = document.createElement('div');

  // Determine layout direction based on which quadrant the node is in
  // Left half: dot — line — text  (text reads left-to-right, tag sits further left)
  // Right half: text — line — dot
  const isLeft  = ux < -0.25;
  const isRight = ux >  0.25;
  const isTop   = uy < -0.25 && !isLeft && !isRight;
  const isBot   = uy >  0.25 && !isLeft && !isRight;

  let tagHTML, tagStyle;

  if (isLeft) {
    // Node on left arc — tag goes to the LEFT of the card, text aligns right
    tagHTML = `<span class="node-tag-text" style="text-align:right;">${n.sub}</span>

               <div class="node-tag-line" style="background:${n.color};"></div>
               <span class="node-tag-text">${n.sub}</span>`;
    tagStyle = `
      left: ${tx + 68}px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: row;
    `;
  } else if (isTop) {
    // Node at top — tag goes above
    tagHTML = `<div class="node-tag-dot" style="background:${n.color};box-shadow:0 0 8px ${n.color};margin:0 auto 3px;"></div>
               <span class="node-tag-text" style="text-align:center;">${n.sub}</span>`;
    tagStyle = `
      left: 50%;
      bottom: calc(100% + 14px);
      transform: translateX(-50%);
      flex-direction: column;
      align-items: center;
    `;
  } else {
    // Node at bottom — tag goes below
    tagHTML = `<span class="node-tag-text" style="text-align:center;">${n.sub}</span>
               <div class="node-tag-dot" style="background:${n.color};box-shadow:0 0 8px ${n.color};margin:3px auto 0;"></div>`;
    tagStyle = `
      left: 50%;
      top: calc(100% + 14px);
      transform: translateX(-50%);
      flex-direction: column;
      align-items: center;
    `;
  }

  tag.innerHTML = tagHTML;
  tag.setAttribute('style', tag.getAttribute('style') || '');
  tag.style.cssText += tagStyle;

  card.style.position = 'absolute'; // already set
  card.appendChild(tag);

  setTimeout(() => {

});

function hexA(hex, a){
  if(!hex || hex.length < 7) return `rgba(0,245,255,${a})`;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,a)).toFixed(3)})`;
}
function lerpC(c1,c2,t){
  const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
  const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
  return '#'+[r1+(r2-r1)*t,g1+(g2-g1)*t,b1+(b2-b1)*t].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
}

/* ───────────────── RIPPLES ───────────────── */
const ripples=[];
class Ripple{
  constructor(x,y,col,spd=1,maxR=160){this.x=x;this.y=y;this.col=col;this.r=2;this.op=.8;this.spd=spd;this.maxR=maxR;}
  step(){this.r+=this.spd*1.1;this.op-=.008*(0.9/this.spd);}
  draw(c){if(this.op<=0)return;c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.strokeStyle=hexA(this.col,this.op);c.lineWidth=1.3;c.stroke();}
  get dead(){return this.op<=0||this.r>this.maxR;}
}

/* ───────────────── LINES ───────────────── */
class Line{
  constructor(fi,ti){this.fi=fi!==undefined?fi:Math.floor(Math.random()*NODES.length);this.reset(ti);}
  reset(ti){
    this.ti=ti!==undefined?ti:(this.fi+1+Math.floor(Math.random()*(NODES.length-1)))%NODES.length;
    if(this.ti===this.fi)this.ti=(this.fi+1)%NODES.length;
    const from=nodePos(NODES[this.fi].angle), to=nodePos(NODES[this.ti].angle);
    this.viaCenter=Math.random()<0.4;
    this.sx=from.x;this.sy=from.y;
    this.mx=this.viaCenter?getCX():to.x; this.my=this.viaCenter?getCY():to.y;
    this.ex=to.x;this.ey=to.y;
    this.p=0;this.phase=this.viaCenter?0:1;
    this.spd=.004+Math.random()*.006;
    this.col=NODES[this.fi].color;this.col2=NODES[this.ti].color;
    this.trail=[];this.maxT=35;this.op=.6+Math.random()*.35;
  }
  update(){
    const tx=this.phase===0?this.mx:this.ex, ty=this.phase===0?this.my:this.ey;
    this.p+=this.spd;
    if(this.p>=1){
      if(this.phase===0){
        this.phase=1;this.p=0;this.sx=this.mx;this.sy=this.my;
        ripples.push(new Ripple(getCX(),getCY(),'#c800c8',1.2,200));
      } else {
        const d=nodePos(NODES[this.ti].angle);
        ripples.push(new Ripple(d.x,d.y,this.col2,.9,115));
        const ot=this.ti;this.fi=ot;this.reset();
      }
    }
    const cx=this.sx+(tx-this.sx)*this.p, cy=this.sy+(ty-this.sy)*this.p;
    this.trail.push({x:cx,y:cy});
    if(this.trail.length>this.maxT)this.trail.shift();
    this.hx=cx;this.hy=cy;
  }
  draw(c){
    if(this.trail.length<2)return;
    for(let i=1;i<this.trail.length;i++){
      const t=i/this.trail.length,a=t*this.op*1.1;
      c.beginPath();c.moveTo(this.trail[i-1].x,this.trail[i-1].y);c.lineTo(this.trail[i].x,this.trail[i].y);
      c.strokeStyle=hexA(lerpC(this.col,this.col2,t),Math.min(1,a));c.lineWidth=2.2*t;c.stroke();
    }
    c.beginPath();c.arc(this.hx,this.hy,3.5,0,Math.PI*2);
    c.fillStyle=this.col2;c.shadowColor=this.col2;c.shadowBlur=18;c.fill();c.shadowBlur=0;
  }
}

const lines=[];
NODES.forEach((_,i)=>lines.push(new Line(i,(i+1)%NODES.length)));

let lastRipT=0, tiltX=0, tiltY=0;

document.addEventListener('mousemove', e => {
  mouse.x=e.clientX; mouse.y=e.clientY;
  cursorEl.style.left  = e.clientX+'px'; cursorEl.style.top  = e.clientY+'px';
  cursorDot.style.left = e.clientX+'px'; cursorDot.style.top = e.clientY+'px';
  const dx=(e.clientX-W()/2)/(W()/2), dy=(e.clientY-H()/2)/(H()/2);
  tiltX+=(dy*-6-tiltX)*0.09; tiltY+=(dx*6-tiltY)*0.09;
  const now=Date.now();
  if(now-lastRipT>170){ripples.push(new Ripple(e.clientX,e.clientY,'#7b00d4',1,80));lastRipT=now;}
});

/* ───────────────── DRAW ───────────────── */
let gOff=0;
function draw(){
  ctx.clearRect(0,0,W(),H());
  // IRONBOW deep void base — coldest point is near-black with violet undertone
  ctx.fillStyle='#02000a';ctx.fillRect(0,0,W(),H());
  document.getElementById('poster').style.transform =
    `perspective(1200px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

  // Grid — cool indigo, mimics IR camera cold-field grid overlay
  gOff=(gOff+0.17)%48;
  ctx.strokeStyle='rgba(80,0,120,.07)';ctx.lineWidth=1;
  for(let x=(gOff%48)-48;x<W();x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H());ctx.stroke();}
  for(let y=(gOff%48)-48;y<H();y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W(),y);ctx.stroke();}

  // Center glow — IRONBOW hot core bloom: indigo base with yellow-white peak
  const cg=ctx.createRadialGradient(getCX(),getCY(),0,getCX(),getCY(),H()*.52);
  cg.addColorStop(0,'rgba(100,0,160,.18)');
  cg.addColorStop(0.35,'rgba(60,0,100,.12)');
  cg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=cg;ctx.fillRect(0,0,W(),H());

  // IRONBOW heat field — each node radiates a blob at its color/intensity
  // This creates the characteristic "thermal camera" heat distribution map
  NODES.forEach(n=>{
    const p=nodePos(n.angle);
    const intensity = n.ibPos/100; // 0..1
    const radius = 80 + intensity * 80;
    const g2=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);
    g2.addColorStop(0,hexA(n.color, intensity * 0.14));
    g2.addColorStop(0.5,hexA(n.color, intensity * 0.06));
    g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2;ctx.fillRect(p.x-radius,p.y-radius,radius*2,radius*2);
  });

  // Static web — IRONBOW cool-field connectors
  NODES.forEach((n,i)=>{
    const f=nodePos(n.angle),t=nodePos(NODES[(i+1)%NODES.length].angle);
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(t.x,t.y);ctx.strokeStyle='rgba(80,0,140,.13)';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(getCX(),getCY());ctx.strokeStyle=hexA(n.color,.08);ctx.lineWidth=.9;ctx.stroke();
  });

  // Idle ripples
  const now=Date.now();
  nrt.forEach((t,i)=>{
    if(now>=t.next){
      const p=nodePos(NODES[i].angle);
      ripples.push(new Ripple(p.x,p.y,t.col,.7,100));
      setTimeout(()=>ripples.push(new Ripple(p.x,p.y,t.col,.4,70)),280);
      t.next=now+t.iv+Math.random()*600;
    }
  });

  lines.forEach(l=>{l.update();l.draw(ctx);});
  for(let i=ripples.length-1;i>=0;i--){ripples[i].step();ripples[i].draw(ctx);if(ripples[i].dead)ripples.splice(i,1);}

  // Mouse glow
  NODES.forEach(n=>{
    const p=nodePos(n.angle),d=Math.hypot(mouse.x-p.x,mouse.y-p.y);
    if(d<140){
      const s=1-d/140;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,80*s+22);
      g.addColorStop(0,hexA(n.color,s*.22));g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(p.x,p.y,80*s+22,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    }
  });

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

window.addEventListener('resize',()=>{
  resizeCanvas();positionCenter();
  NODES.forEach(n=>{
    const p=nodePos(n.angle),c=document.getElementById('node-'+n.id);
    if(c){c.style.left=p.x+'px';c.style.top=p.y+'px';}
  });
});
</script>
</body>
</html>
